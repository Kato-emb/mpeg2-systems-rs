name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; no job here needs more than read.
permissions:
  contents: read

# Cancel superseded PR runs, but never cancel a completed-per-commit run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every rust-cache step saves only on main: a cache saved on a PR branch is
# invisible to other PRs and would only evict main's.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path benches/Cargo.toml --check
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
      # A TODO/FIXME must carry an issue link or owner: `TODO(#12):`, `TODO(name):`, or a URL.
      - name: Forbid bare TODO/FIXME markers
        run: |
          ! grep -rnE '//.*\b(TODO|FIXME)\b' --include='*.rs' . \
            | grep -vE '(TODO|FIXME)\([^)]+\)|#[0-9]+|https?://'
      # The fixtures are made by FFmpeg through xtask, never by this
      # workspace's own writer, so neither xtask nor a build script of it may
      # depend on a library crate.
      - name: Keep xtask independent of the library crates
        run: |
          ! cargo tree -p xtask -e normal,build --prefix none | grep -q '^mpeg2-systems'

  # Every feature combination, so a path that only a non-default set of
  # features compiles is linted as well, the alloc-free one among them.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo hack clippy --workspace --feature-powerset --all-targets -- -D warnings
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings

  # The tests run instrumented, so one run both gates and measures. Coverage is
  # reported, never gated on: a threshold rewards tests that execute lines
  # without stating any behavior.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: nextest,cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo llvm-cov nextest --no-report --workspace --all-features --no-tests=pass
      # The libraries without their default features, so the alloc-free paths
      # are tested as well.
      - run: cargo llvm-cov nextest --no-report --workspace --no-default-features --no-tests=pass
      # Here as well as in the test job, so the allocation test runs on every
      # pull request; uninstrumented, since it counts allocations, not lines.
      - run: cargo test --manifest-path benches/Cargo.toml
      # The report informs and never gates, so it cannot fail the job either; it
      # has nothing to report while no code is covered, as in a crate with no
      # items.
      - continue-on-error: true
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A pure Sans-IO library behaves the same on every host, so a pull request
  # runs the tests on Linux only (the coverage job); main proves macOS and
  # Windows on every merge.
  test:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo nextest run --workspace --all-features --no-tests=pass
      - run: cargo test --manifest-path benches/Cargo.toml

  # The MSRV is read from Cargo.toml, so it is stated once and this job cannot
  # drift from it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --all-features

  # The host jobs link std for their test binaries whatever a crate declares, so
  # std creeping into a library crate — a dropped `#![no_std]`, a dependency that
  # needs std — fails only on a target that ships no std.
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check -p mpeg2-systems --no-default-features --target thumbv7em-none-eabihf

  # Doctests run here, once: they are not instrumented in the coverage job
  # (that needs a nightly toolchain), and the code behaves the same on every host.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Mirror docs.rs, which builds with `--cfg docsrs`, so docsrs-gated doc
      # items are checked here too. Not for the doctests: docsrs may turn on
      # nightly-only attributes that a stable doctest build would refuse.
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings --cfg docsrs"
      - run: cargo test --doc --workspace --all-features
      # The alloc-free build has doctests of its own to pass, without the items alloc adds.
      - run: cargo test --doc -p mpeg2-systems --no-default-features

  # Advisories, license policy, banned crates and sources, per deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny
      - run: cargo deny check
      - run: cargo deny --manifest-path benches/Cargo.toml check

  # The one check the main ruleset requires besides the PR title, so a job can
  # be added or renamed here without editing the ruleset. A skipped job passes:
  # `test` is skipped on pull requests by design.
  ci-success:
    if: always()
    needs: [lint, clippy, coverage, test, msrv, no-std, docs, deny]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
