[package]
name = "examples"
version = "0.0.0"
description = "Programs that read and write Transport Streams and Program Streams with mpeg2-systems"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dev-dependencies]
# The demuxers reassemble sections and PES packets, which takes `alloc`.
mpeg2-systems = { workspace = true, features = ["alloc"] }
# What ffprobe prints, read by the test of `ps_to_ts` against it.
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

[[example]]
name = "ts_demux"
path = "ts_demux.rs"

[[example]]
name = "ps_demux"
path = "ps_demux.rs"

[[example]]
name = "ts_remux"
path = "ts_remux.rs"

[[example]]
name = "ps_remux"
path = "ps_remux.rs"

[[example]]
name = "ps_to_ts"
path = "ps_to_ts.rs"
test = true
