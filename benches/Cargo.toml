[package]
name = "mpeg2-systems-bench"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Kept out of the workspace above: counting allocations takes a global
# allocator, which needs unsafe code, and the workspace forbids unsafe code in
# a way no attribute lifts. Without this table cargo walks up to the workspace
# manifest and refuses a package it does not list.
[workspace]

[dependencies]
mpeg2-systems = { path = "../crates/mpeg2-systems" }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false }

[[bench]]
name = "packet"
harness = false

[[bench]]
name = "framer"
harness = false

[[bench]]
name = "demux"
harness = false

[[bench]]
name = "mux"
harness = false

# This package cannot inherit the workspace's table, since it uses unsafe in
# one place, so it keeps only the lints that guard against what benchmark and
# test code can get wrong. unsafe_code is deny rather than forbid, so the one
# GlobalAlloc impl can lift it with #[expect].
[lints.rust]
unsafe_code = "deny"
# A non-ASCII identifier can only be a mistake or a confusable.
non_ascii_idents = "forbid"
# A lifetime elided in a path hides that a type borrows the input.
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
# A lint is relaxed with #[expect] and a reason, so a stale one is reported.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A throughput or a count computed with `as` is not silently distorted.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
# A debugging print is not left in a measurement.
dbg_macro = "deny"
# Names and module files follow the same rules across the repository.
min_ident_chars = "deny"
mod_module_files = "deny"
